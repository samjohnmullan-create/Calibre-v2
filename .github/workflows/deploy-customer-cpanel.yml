name: Deploy Calibre customer site

on:
  workflow_run:
    workflows: ["Verify Calibre v2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-cpanel
  cancel-in-progress: true

jobs:
  deploy-customer:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
      CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run verify

      - name: Build verified customer site
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Customer deploy credentials unavailable
        if: ${{ env.CPANEL_FTP_USERNAME == '' || env.CPANEL_FTP_PASSWORD == '' }}
        run: echo "::warning::Customer FTPS deployment skipped because CPANEL_FTP_USERNAME and/or CPANEL_FTP_PASSWORD are not configured."

      - name: Deploy to VentraIP cPanel over FTPS (attempt 1)
        id: ftps_attempt_1
        if: ${{ env.CPANEL_FTP_USERNAME != '' && env.CPANEL_FTP_PASSWORD != '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: s06le.syd7.hostingplatform.net.au
          username: ${{ env.CPANEL_FTP_USERNAME }}
          password: ${{ env.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          security: strict
          log-level: standard

      - name: Back off before FTPS retry
        if: ${{ steps.ftps_attempt_1.outcome == 'failure' }}
        run: sleep 15

      - name: Deploy to VentraIP cPanel over FTPS (attempt 2)
        id: ftps_attempt_2
        if: ${{ steps.ftps_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: s06le.syd7.hostingplatform.net.au
          username: ${{ env.CPANEL_FTP_USERNAME }}
          password: ${{ env.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          security: strict
          log-level: standard

      - name: Back off before final FTPS attempt
        if: ${{ steps.ftps_attempt_2.outcome == 'failure' }}
        run: sleep 30

      - name: Deploy to VentraIP cPanel over FTPS (final attempt)
        if: ${{ steps.ftps_attempt_2.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: s06le.syd7.hostingplatform.net.au
          username: ${{ env.CPANEL_FTP_USERNAME }}
          password: ${{ env.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          security: strict
          log-level: standard
