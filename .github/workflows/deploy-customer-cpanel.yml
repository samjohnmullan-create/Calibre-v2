name: Deploy Calibre customer site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-cpanel
  cancel-in-progress: true

jobs:
  deploy-customer:
    runs-on: ubuntu-latest
    env:
      CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
      CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build customer site
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Customer deploy credentials unavailable
        if: ${{ env.CPANEL_FTP_USERNAME == '' || env.CPANEL_FTP_PASSWORD == '' }}
        run: echo "::warning::Customer FTPS deployment skipped because CPANEL_FTP_USERNAME and/or CPANEL_FTP_PASSWORD are not configured."

      - name: Deploy to VentraIP cPanel over FTPS
        if: ${{ env.CPANEL_FTP_USERNAME != '' && env.CPANEL_FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.calibreco.com.au
          username: ${{ env.CPANEL_FTP_USERNAME }}
          password: ${{ env.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          security: strict
          log-level: standard
